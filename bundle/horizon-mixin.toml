[mod]
id = "rift_bleed"
version = "0.1.0"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[api]
path = "api"

[[module]]
id = "rift-bridge"
file = "crates/horizon-client/src/entry.rs"
name = "rift_bridge"
source = "mixins/bridge.rs"
visibility = "pub"

[[module]]
id = "rift-runtime"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "rift_runtime"
source = "mixins/runtime.rs"

[[injection]]
id = "level-tick-pre-runtime"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_pre"
kind = "HEAD"
helper = "mixins/level_tick_pre.rs"
bindings = [
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
    { name = "dimension", ty = "&str", value = "dimension" },
]
